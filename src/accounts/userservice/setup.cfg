[flake8]
max-line-length = 127
max-complexity = 10
exclude = 
    .git,
    __pycache__,
    .pytest_cache,
    venv,
    env,
    .venv,
    .env,
    target,
    htmlcov
ignore = 
    # Line too long (handled by black)
    E501,
    # Line break before binary operator (conflicts with black)
    W503

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70
