name: Contacts Service CI Pipeline

on:
  push:
    branches: [ main, local-deploy, feature/* ]
    paths:
      - 'src/accounts/contacts/**'
      - '.github/workflows/contacts-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/accounts/contacts/**'
      - '.github/workflows/contacts-ci.yml'
  workflow_dispatch:

env:
  SERVICE_NAME: contacts
  SERVICE_PATH: src/accounts/contacts
  DOCKER_REGISTRY: docker.io
  DOCKER_HUB_USERNAME: kamilhakim
  # Using your private repository 'personal-space'
  IMAGE_NAME: kamilhakim/personal-space

jobs:
  # ========================================
  # 🔍 CODE QUALITY & SECURITY ANALYSIS
  # ========================================
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install analysis tools
        run: |
          python -m pip install --upgrade pip
          # Install analysis tools with pip-audit as a more reliable alternative to safety
          pip install flake8 black bandit pytest-cov pip-audit
          # Install project dependencies for better analysis
          cd ${{ env.SERVICE_PATH }}
          pip install -r requirements.txt

      - name: 🎨 Check code formatting with Black
        run: |
          cd ${{ env.SERVICE_PATH }}
          black --check --diff .
        continue-on-error: false

      - name: 🔍 Lint with Flake8
        run: |
          cd ${{ env.SERVICE_PATH }}
          # Using .flake8 config for consistent formatting with Black
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

      - name: 🔒 Security scan with Bandit
        run: |
          cd ${{ env.SERVICE_PATH }}
          bandit -r . -f json -o bandit-report.json --exclude tests,target,htmlcov || true
          bandit -r . -ll --exclude tests,target,htmlcov

      - name: 🛡️ Check dependencies for vulnerabilities
        run: |
          cd ${{ env.SERVICE_PATH }}
          echo "Checking dependencies for vulnerabilities with pip-audit..."
          
          # Generate JSON report with pip-audit
          pip-audit --format=json --output=security-audit.json --require requirements.txt || true
          
          # Run regular check 
          if pip-audit --require requirements.txt; then
            echo "✅ No vulnerabilities found"
          else
            echo "⚠️ Vulnerabilities found - check security-audit.json for details"
            # Don't fail the pipeline for vulnerabilities, just report them
            exit 0
          fi

      - name: 📊 Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            ${{ env.SERVICE_PATH }}/bandit-report.json
            ${{ env.SERVICE_PATH }}/security-audit.json

  # ========================================
  # 🧪 TESTING
  # ========================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: accounts-db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd ${{ env.SERVICE_PATH }}
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: 🧪 Run unit tests with coverage
        env:
          ACCOUNTS_DB_URI: postgresql://postgres:password@localhost:5432/accounts-db
          LOCAL_ROUTING_NUM: "123456789"
          PUB_KEY_PATH: "/tmp/jwtRS256.key.pub"
          PRIV_KEY_PATH: "/tmp/jwtRS256.key"
        run: |
          # Create dummy JWT keys for testing
          mkdir -p /tmp
          openssl genrsa -out /tmp/jwtRS256.key 2048
          openssl rsa -in /tmp/jwtRS256.key -outform PEM -pubout -out /tmp/jwtRS256.key.pub
          
          cd ${{ env.SERVICE_PATH }}
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term

      - name: 📊 Upload test coverage to artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: |
            ${{ env.SERVICE_PATH }}/coverage.xml
            ${{ env.SERVICE_PATH }}/htmlcov/

      - name: 📋 Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Coverage report generated" >> $GITHUB_STEP_SUMMARY

  # ========================================
  # 🏗️ BUILD & PUSH DOCKER IMAGE
  # ========================================
  build:
    name: 🏗️ Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Optimized tagging strategy to minimize repository clutter:
          # - main branch: 'contacts-main' + 'contacts-latest'
          # - local-deploy branch: 'contacts-local-deploy'  
          # - feature branches: 'contacts-feature-latest' (replaces previous)
          # - releases (git tags): 'contacts-v1.2.3' format
          tags: |
            # For main branch: tag as 'main' and 'latest'
            type=raw,value=contacts-main,enable={{is_default_branch}}
            type=raw,value=contacts-latest,enable={{is_default_branch}}
            # For local-deploy branch: tag as 'local-deploy'
            type=raw,value=contacts-local-deploy,enable=${{ github.ref_name == 'local-deploy' }}
            # For feature branches: only 'feature-latest' (replaces previous)
            type=raw,value=contacts-feature-latest,enable=${{ startsWith(github.ref_name, 'feature/') }}
            # For releases (tags): use semantic version
            type=semver,pattern={{version}},prefix=contacts-v

      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          # Only push for main, local-deploy, feature branches, and releases
          push: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'local-deploy' || startsWith(github.ref_name, 'feature/') || github.ref_type == 'tag') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: 🧪 Test Docker image
        if: github.event_name == 'pull_request'
        run: |
          # For PRs, only build and test locally (no push)
          echo "✅ Docker image built successfully (PR - no push to registry)"

      - name: 📊 Build Summary
        run: |
          echo "## 🏗️ Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker image built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- 🏷️ **Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 **Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          
          # Determine push status based on branch
          SHOULD_PUSH="${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'local-deploy' || startsWith(github.ref_name, 'feature/') || github.ref_type == 'tag') }}"
          if [[ "$SHOULD_PUSH" == "true" ]]; then
            echo "- 📦 **Registry:** Docker Hub (pushed)" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **Image URL:** https://hub.docker.com/r/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 📦 **Registry:** Local only (not pushed)" >> $GITHUB_STEP_SUMMARY
          fi

  # ========================================
  # 📋 PIPELINE SUMMARY
  # ========================================
  summary:
    name: 📋 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [code-quality, test, build]
    if: always()
    steps:
      - name: 📊 Generate Pipeline Summary
        run: |
          echo "# 🏦 Contacts Service CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Testing | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
